  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

 #2A5A82;\n  --c-event-butter:  #F6EFD8;\n  --c-event-butter-ink: #7A5C15;\n\n  /* ---------- SEMANTIC ---------- */\n  --c-success: var(--c-accent-500);\n  --c-warning: #D97706;\n  --c-danger:  #DC2626;\n  --c-info:    #2A5A82;\n\n  /* ---------- TYPE ---------- */\n  --ff-sans:    \"Manrope\", -apple-system, BlinkMacSystemFont, \"Segoe UI\", sans-serif;\n  --ff-mono:    \"JetBrains Mono\", ui-monospace, SFMono-Regular, Menlo, monospace;\n  --ff-display: \"Gestura Headline\", \"Gestura\", Georgia, serif;\n\n  /* scale — editorial, tight */\n  --fs-display: 28px;\n  --fs-h1: 22px;\n  --fs-h2: 18px;\n  --fs-h3: 15px;\n  --fs-body: 14px;\n  --fs-sm: 13px;\n  --fs-xs: 12px;\n  --fs-mono: 11px;    /* uppercase labels */\n  --fs-wordmark: 15px;\n\n  --lh-tight: 1.15;\n  --lh-snug: 1.3;\n  --lh-base: 1.5;\n\n  /* uppercase mono labels use wide tracking */\n  --track-label: 0.14em;\n  --track-wordmark: 0.32em;  /* \"C A S S I\" */\n\n  /* ---------- SHAPE ---------- */\n  --r-xs: 3px;\n  --r-sm: 5px;       /* pills, chips, event blocks */\n  --r-md: 7px;       /* inputs, small cards */\n  --r-lg: 10px;      /* panels */\n  --r-xl: 14px;\n  --r-pill: 999px;\n\n  /* ---------- ELEVATION (almost flat) ---------- */\n  --shadow-1: 0 1px 2px rgba(0,0,0,0.03);\n  --shadow-2: 0 4px 16px rgba(0,0,0,0.04), 0 1px 3px rgba(0,0,0,0.03);\n  --shadow-3: 0 12px 28px rgba(0,0,0,0.06), 0 2px 6px rgba(0,0,0,0.04);\n  --shadow-composer: 0 8px 24px rgba(0,0,0,0.08), 0 1px 3px rgba(0,0,0,0.05);\n\n  /* ---------- SPACING ---------- */\n  --s-1: 4px; --s-2: 8px; --s-3: 12px; --s-4: 16px; --s-5: 20px; --s-6: 24px; --s-7: 32px; --s-8: 40px; --s-9: 56px;\n}\n\n/* ============================================================\n   BASE\n   ============================================================ */\n*{ box-sizing:border-box }\nhtml,body{ margin:0; background:var(--c-bg); color:var(--c-ink-1); font-family:var(--ff-sans); font-size:var(--fs-body); line-height:var(--lh-base); -webkit-font-smoothing:antialiased }\n\n.label-mono{ font-family:var(--ff-mono); font-size:var(--fs-mono); font-weight:500; letter-spacing:var(--track-label); text-transform:uppercase; color:var(--c-ink-4) }\n.wordmark{ font-family:var(--ff-sans); font-weight:400; font-size:var(--fs-wordmark); letter-spacing:var(--track-wordmark); text-transform:uppercase; color:var(--c-ink-1) }\n.hairline{ height:1px; background:var(--c-border); border:0 }\n\n.display{ font-family:var(--ff-display); font-weight:400; font-size:var(--fs-display); letter-spacing:-0.02em; line-height:var(--lh-tight) }\nh1,.h1{ font-family:var(--ff-sans); font-weight:600; font-size:var(--fs-h1); letter-spacing:-0.01em; line-height:var(--lh-tight); margin:0 }\nh2,.h2{ font-family:var(--ff-sans); font-weight:600; font-size:var(--fs-h2); letter-spacing:-0.005em; line-height:var(--lh-snug); margin:0 }\nh3,.h3{ font-family:var(--ff-sans); font-weight:600; font-size:var(--fs-h3); line-height:var(--lh-snug); margin:0 }\n<\u002Fstyle>\n\n<style>\nbody{margin:0;background:#F5F5F7}\na{color:#6E4524}\na:hover{color:#0A0A0A}\ninput:focus,textarea:focus{outline:none;border-color:#BDBDC1 !important;background:#FFFFFF !important}\n<\u002Fstyle>\n<\u002Fhelmet>\n<div style=\"min-height:100vh;background:var(--c-bg);font-family:var(--ff-sans);color:var(--c-ink-1);display:flex;flex-direction:column;align-items:center;padding:32px 16px 64px\">\n  <div style=\"width:100%;max-width:680px;display:flex;flex-direction:column;gap:20px\">\n\n    <div style=\"display:flex;align-items:center;justify-content:space-between;gap:16px\">\n      <div style=\"font-size:15px;letter-spacing:0.32em;text-transform:uppercase\">Cassi<\u002Fdiv>\n      <div style=\"font-family:var(--ff-mono);font-size:11px;font-weight:500;letter-spacing:0.14em;text-transform:uppercase;color:var(--c-ink-3);white-space:nowrap\">{{ stepLabel }}<\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"height:2px;background:var(--c-border-strong);border-radius:2px;overflow:hidden\">\n      <div style=\"height:100%;width:{{ progressPct }};background:var(--c-ink-1);transition:width 180ms ease\"><\u002Fdiv>\n    <\u002Fdiv>\n\n    <div style=\"background:var(--c-white);border:1px solid var(--c-border);border-radius:var(--r-xl);padding:32px;display:flex;flex-direction:column;gap:28px\">\n\n      <sc-if value=\"{{ isIntro }}\" hint-placeholder-val=\"{{ true }}\">\n        <div style=\"display:flex;flex-direction:column;gap:10px\">\n          <div style=\"font-family:var(--ff-mono);font-size:11px;font-weight:500;letter-spacing:0.14em;text-transform:uppercase;color:var(--c-ink-3)\">Time study · 5 minutes<\u002Fdiv>\n          <h1 style=\"margin:0;font-size:28px;font-weight:600;letter-spacing:-0.02em;line-height:1.15;text-wrap:pretty\">Where does your week go?<\u002Fh1>\n          <p style=\"margin:0;font-size:15px;line-height:1.5;color:var(--c-ink-2);text-wrap:pretty\">We're mapping how much time goes into coordinating, doing, and closing out work. Rough estimates are fine — pick the range that feels closest to a typical week.<\u002Fp>\n        <\u002Fdiv>\n\n        <div style=\"display:flex;flex-direction:column;gap:12px\">\n          <div style=\"font-family:var(--ff-mono);font-size:11px;font-weight:500;letter-spacing:0.14em;text-transform:uppercase;color:var(--c-ink-3)\">Your role<\u002Fdiv>\n          <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px\">\n            <sc-for list=\"{{ roleOptions }}\" as=\"r\" hint-placeholder-count=\"3\">\n              <button sc-camel-on-click=\"{{ r.onClick }}\" style=\"text-align:left;display:flex;flex-direction:column;gap:4px;padding:14px 16px;border-radius:var(--r-lg);border:1px solid {{ r.bd }};background:{{ r.bg }};cursor:pointer;font-family:var(--ff-sans);transition:all 140ms ease\">\n                <span style=\"font-size:15px;font-weight:600;color:var(--c-ink-1)\">{{ r.label }}<\u002Fspan>\n                <span style=\"font-size:13px;line-height:1.4;color:var(--c-ink-3)\">{{ r.desc }}<\u002Fspan>\n              <\u002Fbutton>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n          <sc-if value=\"{{ roleMissing }}\" hint-placeholder-val=\"{{ false }}\">\n            <div style=\"font-size:13px;color:var(--c-danger)\">Choose the role that best describes you.<\u002Fdiv>\n          <\u002Fsc-if>\n        <\u002Fdiv>\n\n        <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px\">\n          <label style=\"display:flex;flex-direction:column;gap:6px\">\n            <span style=\"font-family:var(--ff-mono);font-size:11px;font-weight:500;letter-spacing:0.14em;text-transform:uppercase;color:var(--c-ink-3)\">Name<\u002Fspan>\n            <input value=\"{{ name }}\" sc-camel-on-change=\"{{ onName }}\" placeholder=\"Jordan Lee\" style=\"font-family:var(--ff-sans);font-size:14px;padding:10px 12px;border:1px solid var(--c-border-strong);border-radius:var(--r-md);background:var(--c-bg);color:var(--c-ink-1)\">\n          <\u002Flabel>\n          <label style=\"display:flex;flex-direction:column;gap:6px\">\n            <span style=\"font-family:var(--ff-mono);font-size:11px;font-weight:500;letter-spacing:0.14em;text-transform:uppercase;color:var(--c-ink-3)\">Company<\u002Fspan>\n            <input value=\"{{ company }}\" sc-camel-on-change=\"{{ onCompany }}\" placeholder=\"Lee Home Services\" style=\"font-family:var(--ff-sans);font-size:14px;padding:10px 12px;border:1px solid var(--c-border-strong);border-radius:var(--r-md);background:var(--c-bg);color:var(--c-ink-1)\">\n          <\u002Flabel>\n          <label style=\"display:flex;flex-direction:column;gap:6px\">\n            <span style=\"font-family:var(--ff-mono);font-size:11px;font-weight:500;letter-spacing:0.14em;text-transform:uppercase;color:var(--c-ink-3)\">Email<\u002Fspan>\n            <input type=\"email\" value=\"{{ email }}\" sc-camel-on-change=\"{{ onEmail }}\" placeholder=\"jordan@example.com\" style=\"font-family:var(--ff-sans);font-size:14px;padding:10px 12px;border:1px solid {{ emailBd }};border-radius:var(--r-md);background:var(--c-bg);color:var(--c-ink-1)\">\n            <sc-if value=\"{{ emailMissing }}\" hint-placeholder-val=\"{{ false }}\">\n              <span style=\"font-size:13px;color:var(--c-danger)\">Enter a valid email.<\u002Fspan>\n            <\u002Fsc-if>\n          <\u002Flabel>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n\n      <sc-if value=\"{{ isSection }}\" hint-placeholder-val=\"{{ false }}\">\n        <div style=\"display:flex;flex-direction:column;gap:8px\">\n          <div style=\"font-family:var(--ff-mono);font-size:11px;font-weight:500;letter-spacing:0.14em;text-transform:uppercase;color:var(--c-ink-3)\">{{ sectionKicker }}<\u002Fdiv>\n          <h1 style=\"margin:0;font-size:22px;font-weight:600;letter-spacing:-0.01em;line-height:1.15\">{{ sectionName }}<\u002Fh1>\n          <p style=\"margin:0;font-size:14px;line-height:1.5;color:var(--c-ink-3)\">{{ sectionDesc }}<\u002Fp>\n        <\u002Fdiv>\n\n        <sc-for list=\"{{ groups }}\" as=\"g\" hint-placeholder-count=\"1\">\n          <div style=\"display:flex;flex-direction:column;gap:12px\">\n            <sc-if value=\"{{ g.showTitle }}\" hint-placeholder-val=\"{{ false }}\">\n              <div style=\"display:flex;align-items:center;gap:10px\">\n                <span style=\"font-family:var(--ff-mono);font-size:11px;font-weight:500;letter-spacing:0.14em;text-transform:uppercase;padding:3px 8px;border-radius:var(--r-sm);background:{{ g.tagBg }};color:{{ g.tagInk }};white-space:nowrap;flex-shrink:0\">{{ g.title }}<\u002Fspan>\n                <span style=\"flex:1;height:1px;background:var(--c-border)\"><\u002Fspan>\n              <\u002Fdiv>\n            <\u002Fsc-if>\n            <sc-for list=\"{{ g.questions }}\" as=\"q\" hint-placeholder-count=\"3\">\n              <div style=\"display:flex;flex-direction:column;gap:12px;padding:16px 18px;margin-left:{{ q.indent }};border:1px solid {{ q.bd }};border-radius:var(--r-lg);background:var(--c-white)\">\n                <div style=\"display:flex;gap:12px;align-items:baseline\">\n                  <span style=\"font-family:var(--ff-mono);font-size:11px;font-weight:500;color:var(--c-ink-4);min-width:22px\">{{ q.num }}<\u002Fspan>\n                  <div style=\"display:flex;flex-direction:column;gap:4px;flex:1;min-width:0\">\n                    <span style=\"font-size:15px;line-height:1.4;font-weight:500;color:var(--c-ink-1);text-wrap:pretty\">{{ q.text }}<\u002Fspan>\n                    <span style=\"font-family:var(--ff-mono);font-size:11px;font-weight:500;letter-spacing:0.14em;text-transform:uppercase;color:var(--c-ink-3)\">{{ q.unit }}<\u002Fspan>\n                  <\u002Fdiv>\n                <\u002Fdiv>\n                <sc-if value=\"{{ q.isNum }}\" hint-placeholder-val=\"{{ true }}\">\n                  <div style=\"display:flex;align-items:center;gap:10px;padding-left:34px\">\n                    <input type=\"number\" inputmode=\"decimal\" min=\"0\" step=\"0.5\" value=\"{{ q.value }}\" sc-camel-on-change=\"{{ q.onChange }}\" placeholder=\"0\" style=\"width:96px;font-family:var(--ff-sans);font-size:15px;font-weight:500;padding:9px 12px;border:1px solid var(--c-border-strong);border-radius:var(--r-md);background:var(--c-bg);color:var(--c-ink-1)\">\n                    <span style=\"font-size:13px;color:var(--c-ink-3);white-space:nowrap\">{{ q.suffix }}<\u002Fspan>\n                  <\u002Fdiv>\n                <\u002Fsc-if>\n                <sc-if value=\"{{ q.isSlider }}\" hint-placeholder-val=\"{{ false }}\">\n                  <div style=\"display:flex;align-items:center;gap:14px;padding-left:34px\">\n                    <input type=\"range\" min=\"0\" max=\"100\" step=\"5\" value=\"{{ q.sliderVal }}\" sc-camel-on-change=\"{{ q.onChange }}\" style=\"flex:1;min-width:0;accent-color:#9C6B3E;cursor:pointer\">\n                    <span style=\"min-width:48px;text-align:right;font-family:var(--ff-mono);font-size:13px;font-weight:500;color:{{ q.readoutInk }}\">{{ q.readout }}<\u002Fspan>\n                  <\u002Fdiv>\n                <\u002Fsc-if>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n\n        <sc-if value=\"{{ showNotes }}\" hint-placeholder-val=\"{{ true }}\">\n          <label style=\"display:flex;flex-direction:column;gap:6px\">\n            <span style=\"font-family:var(--ff-mono);font-size:11px;font-weight:500;letter-spacing:0.14em;text-transform:uppercase;color:var(--c-ink-3)\">Anything to add? (optional)<\u002Fspan>\n            <textarea value=\"{{ sectionNote }}\" sc-camel-on-change=\"{{ onSectionNote }}\" rows=\"3\" placeholder=\"What makes this part of the week slow or frustrating?\" style=\"font-family:var(--ff-sans);font-size:14px;line-height:1.5;padding:10px 12px;border:1px solid var(--c-border-strong);border-radius:var(--r-md);background:var(--c-bg);color:var(--c-ink-1);resize:vertical\"><\u002Ftextarea>\n          <\u002Flabel>\n        <\u002Fsc-if>\n      <\u002Fsc-if>\n\n      <sc-if value=\"{{ isWrap }}\" hint-placeholder-val=\"{{ false }}\">\n        <div style=\"display:flex;flex-direction:column;gap:8px\">\n          <div style=\"font-family:var(--ff-mono);font-size:11px;font-weight:500;letter-spacing:0.14em;text-transform:uppercase;color:var(--c-ink-3)\">Last step<\u002Fdiv>\n          <h1 style=\"margin:0;font-size:22px;font-weight:600;letter-spacing:-0.01em;line-height:1.15\">Anything we missed?<\u002Fh1>\n          <p style=\"margin:0;font-size:14px;line-height:1.5;color:var(--c-ink-3)\">If one part of your week takes more time than it should, tell us about it.<\u002Fp>\n        <\u002Fdiv>\n        <textarea value=\"{{ finalNote }}\" sc-camel-on-change=\"{{ onFinalNote }}\" rows=\"5\" placeholder=\"Optional\" style=\"font-family:var(--ff-sans);font-size:14px;line-height:1.5;padding:10px 12px;border:1px solid var(--c-border-strong);border-radius:var(--r-md);background:var(--c-bg);color:var(--c-ink-1);resize:vertical\"><\u002Ftextarea>\n        <sc-if value=\"{{ submitError }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"font-size:13px;color:var(--c-danger)\">Couldn't send your answers. Check your connection and try again.<\u002Fdiv>\n        <\u002Fsc-if>\n      <\u002Fsc-if>\n\n      <sc-if value=\"{{ isDone }}\" hint-placeholder-val=\"{{ false }}\">\n        <div style=\"display:flex;flex-direction:column;gap:10px;padding:16px 0\">\n          <div style=\"width:36px;height:36px;border-radius:999px;background:#F4ECE4;border:1px solid #D8BEA3;display:flex;align-items:center;justify-content:center;color:#6E4524;font-size:16px\">✓<\u002Fdiv>\n          <h1 style=\"margin:0;font-size:22px;font-weight:600;letter-spacing:-0.01em\">Thanks — that's everything.<\u002Fh1>\n          <p style=\"margin:0;font-size:15px;line-height:1.5;color:var(--c-ink-2)\">Your answers help us see where time goes and where Cassi can take work off your plate.<\u002Fp>\n          <sc-if value=\"{{ previewMode }}\" hint-placeholder-val=\"{{ false }}\">\n            <div style=\"margin-top:8px;font-family:var(--ff-mono);font-size:11px;letter-spacing:0.14em;text-transform:uppercase;padding:8px 10px;border-radius:var(--r-sm);background:var(--c-event-butter);color:var(--c-event-butter-ink)\">Preview mode — no submit URL set, response not recorded<\u002Fdiv>\n          <\u002Fsc-if>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n    <\u002Fdiv>\n\n    <sc-if value=\"{{ showNav }}\" hint-placeholder-val=\"{{ true }}\">\n      <div style=\"display:flex;align-items:center;justify-content:space-between;gap:12px\">\n        <button sc-camel-on-click=\"{{ back }}\" style=\"visibility:{{ backVis }};font-family:var(--ff-sans);font-size:14px;font-weight:500;padding:10px 16px;border-radius:var(--r-md);border:1px solid var(--c-border-strong);background:var(--c-white);color:var(--c-ink-2);cursor:pointer\">Back<\u002Fbutton>\n        <span style=\"font-size:13px;color:var(--c-ink-3)\">{{ answeredText }}<\u002Fspan>\n        <button sc-camel-on-click=\"{{ next }}\" style=\"font-family:var(--ff-sans);font-size:14px;font-weight:600;padding:10px 20px;border-radius:var(--r-md);border:1px solid var(--c-ink-1);background:var(--c-ink-1);color:var(--c-white);cursor:pointer;opacity:{{ nextOpacity }}\">{{ nextLabel }}<\u002Fbutton>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n  <\u002Fdiv>\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;submitUrl&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;https://script.google.com/macros/s/AKfycbybRp6zb_JhXS0vmzWC_pk1iBttEa0JRdsCNJIg55h5xYGMi2rR6jQ_bCQ_2gzeIENb/exec&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Responses&quot;},&quot;requireAll&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Behavior&quot;},&quot;showSectionNotes&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Behavior&quot;}}\">\nconst SCALES = {\n  week: { unit: 'Hours per week', kind: 'num', suffix: 'hrs / week' },\n  pct: { unit: 'Percent of that time', kind: 'slider' },\n  job: { unit: 'Hours per job', kind: 'num', suffix: 'hrs / job' },\n  freq: { unit: 'Percent of jobs', kind: 'slider' }\n};\nconst BUCKETS = [\n  { id: 'team', name: 'Team member coordination', desc: 'Scheduling the week and keeping the team informed.',\n    admin: [\n      { id: 'a_team_1', text: 'How much time do you spend sitting down and scheduling your week?', s: 'week' },\n      { id: 'a_team_2', text: 'How much time do you spend communicating with your team?', s: 'week' },\n      { id: 'a_team_2a', sub: 1, text: 'Of that: sharing info needed to do the job (codes, property info, history, assets)', s: 'week' },\n      { id: 'a_team_2b', sub: 1, text: 'Of that: rescheduling and schedule changes', s: 'week' },\n      { id: 'a_team_2c', sub: 1, text: 'Of that: reviewing jobs and next steps', s: 'week' }\n    ],\n    doer: [\n      { id: 'd_team_1', text: 'How much time do you spend clarifying jobs?', s: 'week' },\n      { id: 'd_team_2', text: 'How much time do you spend preparing for a job?', s: 'week' },\n      { id: 'd_team_3', text: 'How much time do you spend on the road?', s: 'week' }\n    ] },\n  { id: 'vendor', name: 'Vendor coordination', desc: 'Scheduling, briefing, and paying outside vendors.',\n    admin: [\n      { id: 'a_vendor_1', text: 'How much time do you spend scheduling jobs with vendors?', s: 'week' },\n      { id: 'a_vendor_1a', sub: 1, text: 'How much of that time is spent rescheduling?', s: 'pct' },\n      { id: 'a_vendor_2', text: 'How much time do you spend knowledge sharing with vendors?', s: 'week' },\n      { id: 'a_vendor_3', text: 'How much time do you spend negotiating rates and handling vendor payments?', s: 'week' }\n    ],\n    doer: [\n      { id: 'd_vendor_1', text: 'How much time do you spend knowledge sharing with vendors?', s: 'week' },\n      { id: 'd_vendor_2', text: 'How much time do you spend waiting for vendors at a home?', s: 'week' }\n    ] },\n  { id: 'homeowner', name: 'Homeowner coordination', desc: 'Requests, updates, and payments with homeowners.',\n    admin: [\n      { id: 'a_home_1', text: 'How much time do you spend managing intake and requests with homeowners?', s: 'week' },\n      { id: 'a_home_2', text: 'How much time do you spend reporting back to homeowners with updates?', s: 'week' },\n      { id: 'a_home_3', text: 'How much time do you spend administrating and collecting payments from homeowners?', s: 'week' },\n      { id: 'a_home_4', text: 'How much time do you spend knowledge sharing and prepping your team about homeowner preferences and personalities?', s: 'week' }\n    ],\n    doer: [] },\n  { id: 'job', name: 'Doing the job', desc: 'Time on site and documenting the work.',\n    admin: [],\n    doer: [\n      { id: 'd_job_1', text: 'How much time do you spend per job on average?', s: 'job' },\n      { id: 'd_job_2', text: 'How much time do you spend logging notes per week?', s: 'week' },\n      { id: 'd_job_3', text: 'Of jobs you intend to finish in one visit, what percentage take more than one attempt?', s: 'freq' }\n    ] },\n  { id: 'closeout', name: 'Closeout (billing + reporting)', desc: 'Reports, invoices, hours, and expenses.',\n    admin: [\n      { id: 'a_close_1', text: 'How much time do you spend creating and sending reports?', s: 'week' },\n      { id: 'a_close_2', text: 'How much time do you spend collecting data to create invoices?', s: 'week' },\n      { id: 'a_close_3', text: 'How much time do you spend tracking expenses?', s: 'week' }\n    ],\n    doer: [\n      { id: 'd_close_1', text: 'How much time do you spend time tracking and logging hours?', s: 'week' },\n      { id: 'd_close_2', text: 'How much time do you spend communicating with admin to clarify what happened at the job?', s: 'week' }\n    ] }\n];\nconst ROLES = [\n  { id: 'admin', label: 'Admin / operator', desc: 'You schedule, coordinate, and bill.' },\n  { id: 'doer', label: 'Team member', desc: 'You’re in homes doing the work.' },\n  { id: 'both', label: 'Both', desc: 'You run the business and do the jobs.' }\n];\nconst KEY = 'cassi-time-study-draft';\nconst DEFAULT_URL = 'https://script.google.com/macros/s/AKfycbybRp6zb_JhXS0vmzWC_pk1iBttEa0JRdsCNJIg55h5xYGMi2rR6jQ_bCQ_2gzeIENb/exec';\n\nclass Component extends DCLogic {\n  state = { step: 0, role: null, name: '', company: '', email: '', answers: {}, notes: {}, finalNote: '', tried: false, done: false, submitting: false, submitError: false };\n\n  componentDidMount() {\n    try { const d = JSON.parse(localStorage.getItem(KEY) || 'null'); if (d) this.setState({ ...d, tried: false, done: false, submitting: false, submitError: false }); } catch (e) {}\n  }\n  componentDidUpdate() {\n    if (this.state.done) return;\n    const { step, role, name, company, email, answers, notes, finalNote } = this.state;\n    try { localStorage.setItem(KEY, JSON.stringify({ step, role, name, company, email, answers, notes, finalNote })); } catch (e) {}\n  }\n\n  roleSets(role) { return role === 'both' ? ['admin', 'doer'] : role ? [role] : []; }\n  sections() {\n    const sets = this.roleSets(this.state.role);\n    return BUCKETS.filter(b => sets.some(r => b[r].length));\n  }\n  steps() { return ['intro', ...this.sections().map(b => b.id), 'wrap']; }\n  visibleQs(b) { return this.roleSets(this.state.role).flatMap(r => b[r]); }\n\n  go(n) { this.setState({ step: n, tried: false }); try { window.scrollTo({ top: 0 }); } catch (e) {} }\n\n  async submit() {\n    const url = this.props.submitUrl || DEFAULT_URL;\n    const st = this.state;\n    const row = { 'Submitted at': new Date().toISOString(), Role: (ROLES.find(r => r.id === st.role) || {}).label, Name: st.name, Company: st.company, Email: st.email };\n    BUCKETS.forEach(b => {\n      b.admin.forEach(q => { row[`Admin · ${b.name} · ${q.text}`] = st.answers[q.id] || ''; });\n      b.doer.forEach(q => { row[`Team member · ${b.name} · ${q.text}`] = st.answers[q.id] || ''; });\n      row[`Notes · ${b.name}`] = st.notes[b.id] || '';\n    });\n    row['Anything we missed'] = st.finalNote;\n    if (!url) { console.log('Survey response (preview):', row); this.finish(); return; }\n    this.setState({ submitting: true, submitError: false });\n    try {\n      await fetch(url, { method: 'POST', mode: 'no-cors', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(row) });\n      this.finish();\n    } catch (e) { this.setState({ submitting: false, submitError: true }); }\n  }\n  finish() { try { localStorage.removeItem(KEY); } catch (e) {} this.setState({ done: true, submitting: false }); try { window.scrollTo({ top: 0 }); } catch (e) {} }\n\n  renderVals() {\n    const st = this.state;\n    const requireAll = this.props.requireAll ?? true;\n    const steps = this.steps();\n    const step = Math.min(st.step, steps.length - 1);\n    const kind = steps[step];\n    const sections = this.sections();\n    const bucket = BUCKETS.find(b => b.id === kind);\n    const both = st.role === 'both';\n\n    let groups = [], unanswered = 0, total = 0;\n    if (bucket) {\n      let n = 0;\n      groups = this.roleSets(st.role).filter(r => bucket[r].length).map(r => ({\n        title: r === 'admin' ? 'As an admin / operator' : 'As a team member',\n        showTitle: both,\n        tagBg: r === 'admin' ? 'var(--c-event-sky)' : 'var(--c-event-peach)',\n        tagInk: r === 'admin' ? 'var(--c-event-sky-ink)' : 'var(--c-event-peach-ink)',\n        questions: (() => { let main = 0, subc = 0; return bucket[r].map(q => {\n          if (q.sub) subc++; else { main++; subc = 0; }\n          const val = st.answers[q.id]; const has = val !== undefined && val !== ''; total++; if (!has) unanswered++;\n          const missing = st.tried && !has;\n          const sc = SCALES[q.s];\n          return {\n            num: q.sub ? `${main}${'abcdef'[subc - 1]}` : String(main).padStart(2, '0'),\n            text: q.text, unit: SCALES[q.s].unit, indent: q.sub ? '28px' : '0px',\n            bd: missing ? 'var(--c-danger)' : 'var(--c-border)',\n            isNum: sc.kind === 'num', isSlider: sc.kind === 'slider', suffix: sc.suffix || '',\n            value: has ? String(val) : '',\n            sliderVal: has ? Number(val) : 0,\n            readout: has ? `${val}%` : 'Drag',\n            readoutInk: has ? 'var(--c-ink-1)' : 'var(--c-ink-3)',\n            onChange: e => { const v = e.target.value; this.setState(s => ({ answers: { ...s.answers, [q.id]: v === '' ? undefined : (sc.kind === 'slider' ? Number(v) : v) } })); }\n          };\n        }); })()\n      }));\n    }\n\n    const emailOk = /^[^\\s@]+@[^\\s@]+\\.[^\\s@]+$/.test((st.email || '').trim());\n    const emailMissing = st.tried && kind === 'intro' && !emailOk;\n    const canNext = kind === 'intro' ? (!!st.role && emailOk) : kind === 'wrap' ? !st.submitting : (!requireAll || unanswered === 0);\n    const isLast = kind === 'wrap';\n    const secIdx = bucket ? sections.indexOf(bucket) + 1 : 0;\n\n    return {\n      isIntro: !st.done && kind === 'intro',\n      isSection: !st.done && !!bucket,\n      isWrap: !st.done && isLast,\n      isDone: st.done,\n      showNav: !st.done,\n      previewMode: !(this.props.submitUrl || DEFAULT_URL),\n      stepLabel: st.done ? 'Complete' : kind === 'intro' ? 'Start' : isLast ? 'Wrap-up' : `${secIdx} of ${sections.length}`,\n      progressPct: st.done ? '100%' : `${Math.round((step / steps.length) * 100)}%`,\n      roleOptions: ROLES.map(r => ({ ...r, bg: st.role === r.id ? '#F4ECE4' : 'var(--c-white)', bd: st.role === r.id ? '#9C6B3E' : 'var(--c-border-strong)',\n        onClick: () => this.setState({ role: r.id, tried: false }) })),\n      roleMissing: st.tried && !st.role,\n      emailMissing, emailBd: emailMissing ? 'var(--c-danger)' : 'var(--c-border-strong)',\n      name: st.name, company: st.company, email: st.email,\n      onName: e => this.setState({ name: e.target.value }),\n      onCompany: e => this.setState({ company: e.target.value }),\n      onEmail: e => this.setState({ email: e.target.value }),\n      sectionKicker: bucket ? `Section ${secIdx} of ${sections.length}` : '',\n      sectionName: bucket ? bucket.name : '', sectionDesc: bucket ? bucket.desc : '',\n      groups,\n      showNotes: this.props.showSectionNotes ?? true,\n      sectionNote: bucket ? (st.notes[bucket.id] || '') : '',\n      onSectionNote: e => { const id = bucket.id, v = e.target.value; this.setState(s => ({ notes: { ...s.notes, [id]: v } })); },\n      finalNote: st.finalNote, onFinalNote: e => this.setState({ finalNote: e.target.value }),\n      submitError: st.submitError,\n      answeredText: bucket ? `${total - unanswered} of ${total} answered` : '',\n      backVis: step > 0 ? 'visible' : 'hidden',\n      back: () => step > 0 && this.go(step - 1),\n      nextLabel: isLast ? (st.submitting ? 'Sending…' : 'Submit') : 'Next',\n      nextOpacity: canNext ? '1' : '0.45',\n      next: () => {\n        if (!canNext) { this.setState({ tried: true }); return; }\n        if (isLast) this.submit(); else this.go(step + 1);\n      }\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
